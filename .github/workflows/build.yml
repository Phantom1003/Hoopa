name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # The preview runner can break at any time: its failure is marked on its own job only, does not fail the workflow and does not block a release.
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26, the GA image (Xcode 26)
          - runner: macos-26
            preview: false
          # macOS 27 + Xcode 27, public preview; GitHub labels this image "xcode-27", there is no "macos-27" yet.
          - runner: xcode-27
            preview: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        # build.sh refuses to sign ad hoc, so the runner needs the same Apple
        # Development certificate the maintainer builds with: the .p12 export
        # (certificate and private key) base64-encoded in HOOPA_SIGN_P12, its
        # export password in HOOPA_SIGN_P12_PASSWORD. It goes into a throwaway
        # keychain that the last step deletes. Secrets are not available to
        # pull requests from forks; those builds fail here.
        env:
          P12_BASE64: ${{ secrets.HOOPA_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.HOOPA_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::secret HOOPA_SIGN_P12 is not set; build.sh does not sign ad hoc"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build app bundle
        # build.sh picks the Apple Development identity from the keychain imported above.
        # On failure the compiler's errors (the first ten), or else the log's last lines, are raised as annotations too:
        # they show on the run's page and through the checks API, which need no sign-in, while the log itself does.
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          if ./build.sh 2>&1 | tee "$LOG"; then exit 0; fi
          ERRORS=$(perl -ne 'BEGIN { $ws = "$ENV{GITHUB_WORKSPACE}/" } s/\e\[[0-9;]*m//g;
            next unless m{^(/[^:]+):(\d+):(\d+): error: (.*)} and !$seen{$_}++;
            ($f, $l, $c, $m) = ($1, $2, $3, $4); $f =~ s/^\Q$ws\E//; $m =~ s/%/%25/g;
            print "::error file=$f,line=$l,col=${c}::$m\n"; exit if ++$n == 10' "$LOG")
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
          else
            tail -n 20 "$LOG" | perl -0pe 's/\e\[[0-9;]*m//g; s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; $_ = "::error title=build.sh failed::$_\n"'
          fi
          exit 1

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 build/Hoopa.app
          # Apple-signed, not ad hoc: a Team ID is present, so the Accessibility grant survives an update.
          codesign -dv --verbose=2 build/Hoopa.app 2>&1 | grep -E '^TeamIdentifier=[A-Z0-9]{10}$'
          plutil -lint build/Hoopa.app/Contents/Info.plist
          test -f build/Hoopa.app/Contents/Resources/Hoopa.icns
          test -f build/Hoopa.app/Contents/Resources/menubar.png
          test -f build/Hoopa.app/Contents/Resources/menubar@2x.png
          file build/Hoopa.app/Contents/MacOS/Hoopa

      - name: Version matches the tag
        # The updater only installs a bundle whose CFBundleShortVersionString equals the tag (without the v); do not publish a mismatch.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(plutil -extract CFBundleShortVersionString raw build/Hoopa.app/Contents/Info.plist)
          if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Info.plist says $v, the tag says ${GITHUB_REF_NAME#v}: bump CFBundleShortVersionString first" >&2
            exit 1
          fi

      - name: Package
        # ditto keeps the symlinks, permissions and extended attributes inside the bundle.
        run: ditto -c -k --keepParent build/Hoopa.app Hoopa.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hoopa-${{ matrix.runner }}-${{ github.sha }}
          path: Hoopa.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publish the build from the GA image, not the preview one.
      - uses: actions/download-artifact@v4
        with:
          name: Hoopa-macos-26-${{ github.sha }}

      - name: Name the archive after the tag
        run: mv Hoopa.zip "Hoopa-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Hoopa-${{ github.ref_name }}.zip
          generate_release_notes: true
